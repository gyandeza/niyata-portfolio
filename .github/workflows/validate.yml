name: Validate Niyata portfolio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node tests/flow-model-fixtures.mjs
      - run: node tests/premerge-smoke.mjs
      - run: node tests/staging-artifact-guard.mjs
